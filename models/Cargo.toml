[package]
name = "models"
version = "0.1.1"
edition = "2024"
license.workspace = true

[lints]
workspace = true

# One language, chosen at build time, forwarded straight through to `strings`.
# `default-features = false` here matters: without it, this crate's own
# default (`lang-en`) would stay active even when something depending on
# `models` (namely `engine`) asks for a different language, and the two
# would both be enabled on the one shared `strings` instance at once -- see
# `strings/Cargo.toml`'s comment on what that does.
[features]
default = ["lang-en"]
lang-en = ["strings/lang-en"]
lang-pt = ["strings/lang-pt"]
lang-es = ["strings/lang-es"]
lang-ht = ["strings/lang-ht"]

[dependencies]
strings = { path = "../strings", default-features = false }
# The particle layer's arithmetic, kept in a `no_std` crate with no dependencies
# so `compat/` can compile it for a microcontroller and have that mean something
# about the game rather than about a copy of it. `std` is on here because a
# hosted build has an `f32::ceil` intrinsic worth using; see the crate's own
# `Cargo.toml` for why that flag cannot change an answer.
particle-core = { path = "../particle-core", features = ["std"] }
crossterm = "0.29.0"
bevy_ecs = "0.12" 
getrandom = "0.4.3"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
fixedbitset = { version = "0.5", features = ["serde"] }

# Test-only. `models` already depends on `fixedbitset` at this version for
# `Viewshed.revealed_tiles` and `Map.dark`; an integration test is its own
# crate, so it needs its own line to build the same bitsets when it assembles
# a fixture world by hand. No new crate enters the graph.
[dev-dependencies]
fixedbitset = { version = "0.5", features = ["serde"] }

# `tests/effects.rs` reads the game's own source to check that no effect is
# attached or detached behind the ledger's back — a rule the compiler has no
# way to state. It used to match strings, which could not see an effect inside
# a spawn bundle or behind a renamed import, so it parses now instead.
#
# Both crates are already in the graph: the derive macros pull them in, and
# `Cargo.lock` pins these same versions. The cost is build time, not a new
# name — syn builds again here for the host rather than for a proc macro, and
# `span-locations` is what turns a finding into a file and a line somebody can
# open.
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
