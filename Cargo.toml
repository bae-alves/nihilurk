[workspace]
resolver = "3"
members = [
    "compat",
    "engine",
    "models",
    "particle-core",
    "view"
]

# `compat` is a test rig, not part of the game: it pulls in ratatui, which the
# shipped binary is not allowed to depend on (see the portability note in
# `gdd.md`). It is also a rig that builds and runs the game for *other
# machines*, so it is never itself part of what is being measured. Keeping it
# out of `default-members` means a bare `cargo build` / `cargo test` at the
# workspace root never compiles it; reaching it is always explicit, via
# `-p nihilurk-compat` or `compat_test.sh`.
#
# Cargo has no `default-exclude`, so this has to be written as an include-list:
# one name meaning "not that one", kept in step by hand. Two lists that have to
# agree and nothing checking that they do is why there is a third thing here --
# `engine/tests/workspace.rs` asserts that the difference between `members` and
# `default-members` is exactly the rig, and that no crate in the tree is
# missing from `members` altogether. Add a crate to one list and forget the
# other and a bare `cargo test` says so.
default-members = [
    "engine",
    "models",
    "particle-core",
    "view"
]

[workspace.package]
license = "GPL-3.0-or-later"

# Clippy: only the `correctness`, `suspicious`, `complexity` and `perf` lint
# groups are used. Everything else (notably `style`, plus `pedantic`/`nursery`)
# is silenced. `all` is allowed first at a lower priority so the four groups
# below win where they overlap.
[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

# What actually ships. Every knob here costs compile time and buys either
# runtime speed or bytes on disk; none of them change behaviour.
#
#   lto = "fat"          one LTO pass over the whole dependency graph, so
#                        `Particle::current` can inline into the render loop
#                        across the models/engine crate boundary.
#   codegen-units = 1    no parallel-codegen inlining barriers. Worth it here
#                        because the hot loop is small and inlining-sensitive.
#   panic = "abort"      drops the unwind tables. Safe for nihilurk: there is not a
#                        single `#[should_panic]` in the suite, and a panic
#                        mid-turn is unrecoverable anyway. Cargo ignores this
#                        key for the `test`/`bench` profiles, so benches and
#                        `cargo test` are unaffected.
#   strip = "symbols"    a ~2-3x smaller binary. This is *also* why profiling
#                        does not run on this profile -- see below.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile `compat/cross_build.sh`'s "blame" stage builds with, to attribute
# a foreign-target binary's size back to the crates that produced it.
#
# It is byte-for-byte the same machine code as `release` -- same opt-level,
# same LTO, same codegen-units -- with the symbols put back. That matters: a
# stripped binary has nothing for `llvm-nm` to read, and a per-crate size
# breakdown of a *differently optimised* binary would be a breakdown of a
# program nobody ships. Inheriting rather than redeclaring is what keeps the
# two from drifting.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
