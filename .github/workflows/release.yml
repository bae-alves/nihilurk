# Push a tag like `v0.1.2` and this builds the tarballs, attaches them to a
# GitHub release, and publishes the crates to crates.io. The recipe, and what to
# do when a job fails, is docs/how-to/cut-a-release.md.
name: release

on:
  push:
    tags: ["v*"]
  # A manual run is a rehearsal: it only proves crates.io will accept this
  # workflow. See the `rehearsal` job. Nothing is built or published.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The tarballs are named from engine/Cargo.toml. A tag that disagrees
      # would ship v0.1.2 binaries under the name of v0.1.1.
      - name: tag matches engine/Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but engine/Cargo.toml says v$version" >&2
            exit 1
          fi
      - run: cargo test --locked --workspace --exclude nihilurk-compat

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both Linux targets are musl: one static file, no glibc to match.
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      # Builds through package.sh, then unpacks the tarball and plays with it.
      - run: release/test_package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nihilurk-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nihilurk-*
          path: dist
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  # Publishes the four crates with crates.io Trusted Publishing: the job trades
  # GitHub's OIDC token for a short-lived publish token, so no secret is
  # stored. Set up once per crate on crates.io (repo bae-alves/nihilurk,
  # workflow release.yml). docs/how-to/cut-a-release.md has the steps.
  #
  # One crate at a time, in dependency order, skipping any version crates.io
  # already has. A failed run can be re-run: it picks up where it stopped.
  # Keep the list in step with `members` in Cargo.toml.
  crates-io:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish what crates.io does not have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for dir in particle-core strings models engine; do
            name="$(sed -n 's/^name = "\(.*\)"/\1/p' "$dir/Cargo.toml" | head -1)"
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$dir/Cargo.toml" | head -1)"
            if curl -fs -A "nihilurk-release (github.com/bae-alves/nihilurk)" \
                "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
              echo "$name $version is already on crates.io, skipping"
            else
              cargo publish -p "$name" --locked
            fi
          done

  # `gh workflow run release.yml` runs only this job. It asks crates.io for a
  # publish token and throws it away. That proves crates.io accepts this
  # repository and this workflow file. It does not prove all four crates are
  # set up: the token's scope is not reported, so check each crate's settings
  # on crates.io once. Nothing is published.
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: the exchange worked
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          test -n "$TOKEN"
          echo "crates.io issued a publish token for this workflow. Nothing was published."
