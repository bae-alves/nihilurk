[package]
name = "nihilurk-models"
description = "The rules of nihilurk, a terminal roguelike: bevy_ecs components, monsters, items, spells, combat and procedural map generation."
version = "0.7.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version = "1.91"
keywords = ["roguelike", "ecs", "bevy", "procedural", "gamedev"]
categories = ["game-development", "games"]
# This one reads the workspace around the crate, so it cannot pass from a
# download. It still runs in the repository.
exclude = [
    "tests/effects.rs",
]

[lib]
name = "models"

[lints]
workspace = true

[dependencies]
strings = { package = "nihilurk-strings", path = "../strings", version = "0.7.0" }
bevy_ecs = "0.12" 
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
fixedbitset = { version = "0.5", features = ["serde"] }

[dev-dependencies]

# `tests/effects.rs` reads the game's own source to check that no effect is
# attached or detached behind the ledger's back — a rule the compiler has no
# way to state. It used to match strings, which could not see an effect inside
# a spawn bundle or behind a renamed import, so it parses now instead.
#
# Both crates are already in the graph: the derive macros pull them in, and
# `Cargo.lock` pins these same versions. The cost is build time, not a new
# name — syn builds again here for the host rather than for a proc macro, and
# `span-locations` is what turns a finding into a file and a line somebody can
# open.
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
