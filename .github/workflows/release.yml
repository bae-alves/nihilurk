# Push a tag like `v0.1.2` and this builds the tarballs and attaches them to a
# GitHub release. The recipe, and what to do when a job fails, is
# docs/how-to/publish-a-github-release.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tarballs are named from engine/Cargo.toml. A tag that disagrees
      # would ship v0.1.2 binaries under the name of v0.1.1.
      - name: tag matches engine/Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but engine/Cargo.toml says v$version" >&2
            exit 1
          fi
      - run: cargo test --locked --workspace --exclude nihilurk-compat

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both Linux targets are musl: one static file, no glibc to match.
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      # Builds through package.sh, then unpacks the tarball and plays with it.
      - run: release/test_package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nihilurk-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nihilurk-*
          path: dist
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
