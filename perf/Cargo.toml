[package]
name = "roog-perf"
version = "0.1.0"
edition = "2024"
publish = false
description = "Visual stress test and micro-benchmark rig for roog's particle layer."

[lints]
workspace = true

[[bin]]
name = "roog-perf"
path = "src/main.rs"
# Without this, `cargo bench` also runs the binary's own libtest harness, which
# is handed criterion's arguments and dies on the first one it does not know
# (`error: Unrecognized option: 'save-baseline'`). The benchmarks live in
# benches/; the binary has none.
bench = false

[[bench]]
name = "particles"
harness = false

# The redraw half. Separate from `particles` because it measures the rig's copy
# of the game's `Screen` rather than anything in `models`, and mixing the two
# in one target would hide which of them a regression came from.
[[bench]]
name = "redraw"
harness = false

[dependencies]
# The system under test. Nothing in this crate is allowed to flow back the
# other way: `models` must never depend on `roog-perf`.
models = { path = "../models" }
# The real `Screen`, so the rig measures the renderer the game has rather than
# a copy of it. See `perf/src/screen.rs`.
view = { path = "../view" }

# Same version `models` uses, and for the same reason as crossterm below: the
# `--load game` floor is built by handing `models::initialize_world` a real
# `World`, and a second copy of bevy_ecs in the graph would make that a
# different `World` type than the one `models` accepts. Only `game.rs` touches
# it -- the frame loop never runs a system, because ECS iteration inside a
# measurement of the particle layer would be measuring the wrong thing.
bevy_ecs = "0.12"

# Pinned to the same crossterm `models` uses, so `crossterm::style::Color`
# crossing the boundary is one type and not two identically-named ones. If a
# ratatui bump ever drags in a different crossterm, the rig stops compiling --
# two identically-named `Color` types, one of which `models` will not accept --
# and stage 4 of perf_test.sh is where that shows up. `cargo tree -i crossterm`
# says which version won.
crossterm = "0.29.0"
ratatui = "0.30.2"

# RSS. A ~1 microsecond read of /proc/self/statm -- cheap enough that the
# sampler thread can poll it at 10 Hz without showing up in its own numbers.
memory-stats = "1.2.0"

# Process CPU%. `default-features = false` drops the disk/network/component
# probes, which this rig never reads and which make `refresh` several times
# more expensive.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
