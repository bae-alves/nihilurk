[workspace]
resolver = "3"
members = [
    "engine",
    "models",
    "strings"
]

[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/bae-alves/nihilurk"
# One README for every crate: it is the game's front page and its crate map, so
# a library's page on crates.io points the reader at the thing it belongs to.
readme = "README.md"
#
# `rust-version` is not shared, because the crates do not share a floor: the
# two leaf crates build on 1.85 (what edition 2024 sets) and `models` needs
# 1.91, for let chains (1.88) and a const `TypeId::of` (1.91). `engine`
# follows `models`.

# Clippy: only the `correctness`, `suspicious`, `complexity` and `perf` lint
# groups are used. Everything else (notably `style`, plus `pedantic`/`nursery`)
# is silenced. `all` is allowed first at a lower priority so the four groups
# below win where they overlap.
[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

# Debug and test builds. Full debug info made one `models` build 85 MB, and
# `target/` keeps every build it ever made. Line tables still give a panic's
# backtrace its files and lines; a debugger loses local variables.
[profile.dev]
debug = "line-tables-only"

# What actually ships. Every knob here costs compile time and buys either
# runtime speed or bytes on disk; none of them change behaviour.
#
#   lto = "fat"          one LTO pass over the whole dependency graph, so
#                        `Particle::current` can inline into the render loop
#                        across the models/engine crate boundary.
#   codegen-units = 1    no parallel-codegen inlining barriers. Worth it here
#                        because the hot loop is small and inlining-sensitive.
#   panic = "abort"      drops the unwind tables. Safe for nihilurk: there is not a
#                        single `#[should_panic]` in the suite, and a panic
#                        mid-turn is unrecoverable anyway. Cargo ignores this
#                        key for the `test`/`bench` profiles, so benches and
#                        `cargo test` are unaffected.
#   strip = "symbols"    a ~2-3x smaller binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
