# What pre-commit checks on a maintainer's machine, run again on every pull
# request, because a contributor's clone may never have enabled the hook
# (`git config core.hooksPath .githooks`). The release workflow is separate:
# it runs on a tag, see release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: no python
        run: lua5.4 .githooks/no_python.lua --tree
      - name: the hooks and the release script still work
        run: |
          lua5.4 .githooks/no_python_test.lua
          lua5.4 .githooks/docs_nudge_test.lua
          lua5.4 .claude/hooks/rustfmt_test.lua
          lua5.4 release/bump_test.lua
      - run: ./docs_style.sh
      - run: cargo test --locked --workspace --exclude nihilurk-compat
      # A bare `cargo test` only builds English. pt, es and ht each need a
      # line for every English sentence, and a missing one breaks that
      # binary. The pre-commit hook stubs the gap; without the hook, it is
      # this check that finds it.
      - name: every language still builds
        run: |
          for lang in pt es ht; do
            cargo check --locked -p nihilurk --no-default-features --features "lang-$lang" || {
              echo "lang-$lang does not build. If a sentence is missing from its file, run: lua .githooks/stub_missing_translations.lua" >&2
              exit 1
            }
          done
