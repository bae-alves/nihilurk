[workspace]
resolver = "3"
members = [
    "compat",
    "engine",
    "models",
    "particle-core",
    "perf",
    "view"
]

# `perf` and `compat` are test rigs, not part of the game: they pull in ratatui,
# sysinfo and criterion, none of which the shipped binary is allowed to depend
# on (see the portability note in `gdd.md`). Keeping them out of
# `default-members` means a bare `cargo build` / `cargo test` at the workspace
# root never compiles them; reaching one is always explicit, via `-p nihilurk-perf`
# / `-p nihilurk-compat`, or via `perf_test.sh` / `compat_test.sh`.
#
# `compat` is the odder of the two: it is a rig that builds and runs the game
# for *other machines*, so it is the one crate here that is never itself part of
# what is being measured.
#
# Cargo has no `default-exclude`, so this has to be written as an include-list:
# four names to mean "not those two", kept in step by hand. Two lists that have
# to agree and nothing checking that they do is how the perf rig ended up with
# its own private copy of the renderer, so there is a third thing here --
# `engine/tests/workspace.rs` asserts that the difference between `members` and
# `default-members` is exactly the two rigs, and that no crate in the tree is
# missing from `members` altogether. Add a crate to one list and forget the
# other and a bare `cargo test` says so.
default-members = [
    "engine",
    "models",
    "particle-core",
    "view"
]

# Clippy: only the `correctness`, `suspicious`, `complexity` and `perf` lint
# groups are used. Everything else (notably `style`, plus `pedantic`/`nursery`)
# is silenced. `all` is allowed first at a lower priority so the four groups
# below win where they overlap.
[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Cargo's own unused-dependency lint is target-scoped: a plain `cargo test`
# builds only the lib, bins and integration tests, never `benches/`, so a
# dev-dependency used solely by a `harness = false` bench target (`perf`'s
# `criterion`) reads as unused even though `cargo bench` / `--all-targets`
# needs it. That is a false positive baked into how the lint works, not a
# stale dependency, so it is allowed workspace-wide rather than chased crate
# by crate. A genuinely unused dependency is still caught by
# `cargo clippy --all-targets`, which every touched crate is built with.
[workspace.lints.cargo]
unused_dependencies = "allow"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

# What actually ships. Every knob here costs compile time and buys either
# runtime speed or bytes on disk; none of them change behaviour.
#
#   lto = "fat"          one LTO pass over the whole dependency graph, so
#                        `Particle::current` can inline into the render loop
#                        across the models/engine crate boundary.
#   codegen-units = 1    no parallel-codegen inlining barriers. Worth it here
#                        because the hot loop is small and inlining-sensitive.
#   panic = "abort"      drops the unwind tables. Safe for nihilurk: there is not a
#                        single `#[should_panic]` in the suite, and a panic
#                        mid-turn is unrecoverable anyway. Cargo ignores this
#                        key for the `test`/`bench` profiles, so benches and
#                        `cargo test` are unaffected.
#   strip = "symbols"    a ~2-3x smaller binary. This is *also* why profiling
#                        does not run on this profile -- see below.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile every tool in `perf_test.sh` builds with.
#
# It is byte-for-byte the same machine code as `release` -- same opt-level,
# same LTO, same codegen-units -- with the symbols put back. That matters: a
# flamegraph of a *differently optimised* binary is a flamegraph of a program
# you do not ship, and `cargo bloat` on a stripped binary has nothing to read.
# Inheriting rather than redeclaring is what keeps the two from drifting.
#
# Frame pointers are not a profile key; `perf_test.sh` passes
# `-C force-frame-pointers=yes` in RUSTFLAGS, without which `perf record -g`
# cannot walk the stack out of an LTO'd, codegen-units=1 build.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Criterion measures the code as shipped, plus symbols so a bench can be fed
# straight to `perf`/flamegraph when a regression needs chasing.
[profile.bench]
inherits = "release"
debug = true
strip = "none"
