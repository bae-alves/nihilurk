[package]
name = "nihilurk-compat"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Cross-compilation and shell/std reachability matrix for nihilurk."

[lints]
workspace = true

[[bin]]
name = "nihilurk-compat"
path = "src/main.rs"

# No dependencies. This crate reads two tab-separated files the shell half of
# the pipeline writes and prints a table -- there is nothing here that needs
# more than std. Note what is *not* here either: `models`. The compat rig
# never touches the game's types -- it builds the game, runs it inside a
# container, and reads what comes back on stdout. Keeping the dependency out
# means this crate cannot accidentally become a second place where game logic
# lives, and it means the matrix can be driven against a binary this
# workspace did not build.
