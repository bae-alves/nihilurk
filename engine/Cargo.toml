[package]
name = "nihilurk"
description = "A Rogue-like dungeon crawler for the terminal: descend thirteen floors, take the Element of Yoord, carry it back up. One binary, no assets, permanent death."
version = "0.7.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
# A bin-only crate has no API docs, so docs.rs says "not a library". Send the
# Documentation link on crates.io to the player manual instead.
documentation = "https://github.com/bae-alves/nihilurk/blob/master/MANUAL.md"
rust-version = "1.91"
keywords = ["roguelike", "game", "terminal", "ascii", "rpg"]
categories = ["games"]
# Reads the workspace around it, so it cannot pass from a download. It still
# runs in the repository. `engine/tests/workspace.rs` holds this line in place.
exclude = ["tests/workspace.rs"]

[[bin]]
name = "nihilurk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
models = { package = "nihilurk-models", path = "../models", version = "0.7.0" }
strings = { package = "nihilurk-strings", path = "../strings", version = "0.7.0" }
crossterm = "0.29.0"
bevy_ecs = "0.12"
rand = "0.10"