# What pre-commit checks on a maintainer's machine, run again on every pull
# request, because a contributor's clone may never have enabled the hook
# (`git config core.hooksPath .githooks`). The release workflow is separate:
# it runs on a tag, see release.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: no python
        run: lua5.4 .githooks/no_python.lua --tree
      - name: the hooks and the release script still work
        run: |
          lua5.4 .githooks/no_python_test.lua
          lua5.4 .githooks/tag_english_placeholders_test.lua
          lua5.4 .claude/hooks/rustfmt_test.lua
          lua5.4 release/bump_test.lua
          lua5.4 site/build_test.lua
      - run: cargo test --locked --workspace

  # Does the game build, pass its tests and start on Windows and macOS? This
  # does not replace a human at a real console: it cannot see rendering or key
  # input.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked -p nihilurk
      - run: cargo test --locked --workspace
      - name: the binary starts
        run: cargo run --locked -p nihilurk -- --help

  # The release tarball and zip, built and played the way release.yml does it.
  # Four fat-LTO builds per OS, so not on pull requests. Linux gets this check
  # on a tag; Windows and macOS get it here so a tag day is not the first run.
  package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Windows runs `run:` in PowerShell, which would skip a .sh file and
      # report success. Name bash.
      - run: release/test_package.sh ${{ matrix.target }}
        shell: bash
